<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据字典 - __DATABASE__</title>
<style>
:root {
    --bg: #f8f9fa;
    --bg-card: #ffffff;
    --bg-sidebar: #1e293b;
    --text: #1e293b;
    --text-light: #64748b;
    --text-sidebar: #cbd5e1;
    --border: #e2e8f0;
    --accent: #3b82f6;
    --accent-light: #dbeafe;
    --green: #10b981;
    --green-bg: #d1fae5;
    --blue: #3b82f6;
    --blue-bg: #dbeafe;
    --orange: #f59e0b;
    --orange-bg: #fef3c7;
    --red: #ef4444;
    --red-bg: #fee2e2;
    --purple: #8b5cf6;
    --purple-bg: #ede9fe;
    --teal: #14b8a6;
    --teal-bg: #ccfbf1;
    --sidebar-w: 280px;
    --header-h: 60px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: var(--sidebar-w); background: var(--bg-sidebar); color: var(--text-sidebar); position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 10; transition: transform 0.3s; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px 20px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
.sidebar-header h1 { font-size: 18px; color: #fff; margin-bottom: 4px; }
.sidebar-header p { font-size: 12px; opacity: 0.7; }

/* Sidebar Search */
.sidebar-search { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; display: flex; gap: 6px; align-items: center; }
.sidebar-search-input { flex: 1; position: relative; }
.sidebar-search-input input { width: 100%; padding: 7px 10px 7px 30px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s, background 0.2s; }
.sidebar-search-input input::placeholder { color: rgba(255,255,255,0.4); }
.sidebar-search-input input:focus { border-color: var(--accent); background: rgba(255,255,255,0.12); }
.sidebar-search-input::before { content: "\1F50D"; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }
.sidebar-search-btn { padding: 7px 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.sidebar-search-btn:hover { opacity: 0.85; }

/* Sidebar Nav Container */
.sidebar-nav { flex: 1; overflow-y: auto; }

/* Nav Section (top-level: 数据库表 / 项目实体) */
.nav-section { border-bottom: 1px solid rgba(255,255,255,0.08); }
.nav-section-title { padding: 11px 16px; font-size: 14px; font-weight: 700; color: #e2e8f0; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; }
.nav-section-title:hover { color: #fff; background: rgba(255,255,255,0.05); }
.nav-section.collapsed .nav-section-body { display: none; }
.nav-section.collapsed .nav-section-title .arrow:first-child { transform: rotate(-90deg); }
.nav-show-all { margin-left: auto; font-size: 16px; opacity: 0.5; cursor: pointer; padding: 0 4px; line-height: 1; }
.nav-show-all:hover { opacity: 1; }

/* Nav Group (prefix groups) */
.nav-group { border-top: 1px solid rgba(255,255,255,0.03); }
.nav-group-title { padding: 8px 20px; font-size: 12px; font-weight: 600; color: #94a3b8; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
.nav-group-title:hover { color: #fff; }
.arrow { font-size: 10px; transition: transform 0.2s; display: inline-block; width: 12px; flex-shrink: 0; }
.nav-group.collapsed .arrow { transform: rotate(-90deg); }
.nav-group.collapsed .nav-list { display: none; }

/* Nav Item */
.nav-list { list-style: none; }
.flat-list { max-height: 45vh; overflow-y: auto; padding: 4px 0; }
.flat-list::-webkit-scrollbar { width: 4px; }
.flat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.nav-item a { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 4px 24px; color: var(--text-sidebar); text-decoration: none; font-size: 13px; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item a:hover { background: rgba(255,255,255,0.08); color: #fff; }
.nav-item.active a { background: var(--accent); color: #fff; }
.nav-item.hidden { display: none; }
.badge { background: rgba(255,255,255,0.15); padding: 1px 6px; border-radius: 10px; font-size: 11px; flex-shrink: 0; }

/* Main */
.main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }
.top-bar { position: sticky; top: 0; z-index: 5; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
.db-name { font-size: 14px; color: var(--text-light); white-space: nowrap; }
.back-btn { display: none; padding: 6px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.back-btn:hover { opacity: 0.9; }
.back-btn.visible { display: inline-block; }

.content { padding: 24px; }

/* Stats */
.stats-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
.stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }

/* Table sections */
.table-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
.table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.table-header h2 { font-size: 18px; font-family: monospace; }
.table-desc { font-size: 13px; color: var(--text-light); margin-top: 2px; display: block; }
.table-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--text-light); }
.table-meta span { background: var(--bg); padding: 2px 8px; border-radius: 4px; }

h3 { font-size: 14px; padding: 12px 20px 8px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }

/* Detail tables */
.table-scroll { overflow-x: auto; }
.detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.detail-table th { background: var(--bg); padding: 8px 12px; text-align: left; font-weight: 600; font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.3px; position: sticky; top: 0; white-space: nowrap; }
.detail-table td { padding: 7px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.detail-table tr:hover { background: var(--accent-light); }
.col-num { color: var(--text-light); font-size: 12px; width: 30px; }
.col-name code { background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.col-type { font-family: monospace; font-size: 12px; white-space: nowrap; }
.col-default code { font-size: 11px; color: var(--text-light); }
.col-extra { font-size: 12px; }
.key-pk { color: var(--orange); font-weight: 600; }
.key-idx { color: var(--blue); }
.comment-pending { color: var(--red); font-style: italic; }
.comment-ai { color: var(--orange); }

/* Source tags */
.source-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap; }
.source-db { background: var(--green-bg); color: #065f46; }
.source-code { background: var(--blue-bg); color: #1e40af; }
.source-jsp { background: var(--purple-bg); color: #5b21b6; }
.source-enum { background: var(--teal-bg); color: #134e4a; }
.source-mapper { background: var(--blue-bg); color: #1e40af; }
.source-vo { background: var(--blue-bg); color: #1e40af; }
.source-ai { background: var(--orange-bg); color: #92400e; }
.source-pending { background: var(--red-bg); color: #991b1b; }
.source-unknown { background: var(--border); color: var(--text-light); }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 20px; background: var(--bg); border-top: 1px solid var(--border); font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 4px; }

/* Hidden */
.hidden { display: none !important; }

/* Mobile */
.menu-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
@media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-toggle { display: block; }
    .stats-panel { grid-template-columns: repeat(3, 1fr); }
}

/* Print */
@media print {
    .sidebar, .top-bar, .search-box { display: none; }
    .main { margin-left: 0; }
    .table-section { break-inside: avoid; }
}

/* Editable elements */
.editable { position: relative; cursor: pointer; border-radius: 3px; transition: background 0.15s; }
.editable:hover { background: var(--accent-light); }
.editable:hover::after { content: "\270E"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--accent); opacity: 0.7; pointer-events: none; }
.edit-input { width: 100%; padding: 4px 8px; border: 2px solid var(--accent); border-radius: 4px; font-size: 13px; font-family: inherit; outline: none; box-shadow: 0 2px 8px rgba(59,130,246,0.2); }
.edit-input:focus { border-color: var(--accent); }
.edit-bar { display: flex; gap: 4px; margin-top: 4px; align-items: center; }
.edit-bar button { padding: 2px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; cursor: pointer; background: var(--bg-card); }
.edit-bar button:first-child { background: var(--accent); color: #fff; border-color: var(--accent); }
.edit-bar button:hover { opacity: 0.85; }
.edit-hint { font-size: 11px; color: var(--text-light); margin-left: 6px; }
.edit-saving { opacity: 0.6; pointer-events: none; }
.edit-success { animation: editFlash 0.8s ease; }
.edit-error { animation: editShake 0.4s ease; border-color: var(--red) !important; }
@keyframes editFlash { 0% { background: var(--green-bg); } 100% { background: transparent; } }
@keyframes editShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.edit-toast { position: fixed; bottom: 24px; right: 24px; padding: 10px 20px; border-radius: 8px; font-size: 13px; color: #fff; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.edit-toast.show { opacity: 1; }
.edit-toast.ok { background: var(--green); }
.edit-toast.fail { background: var(--red); }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h1>数据字典</h1>
        <p>__DATABASE__ | __NOW__</p>
    </div>
    <div class="sidebar-search">
        <div class="sidebar-search-input">
            <input type="text" id="searchInput" placeholder="搜索表名、字段名..." autocomplete="off">
        </div>
        <button class="sidebar-search-btn" id="searchBtn">搜索</button>
    </div>
    <div class="sidebar-nav">
        __SIDEBAR_HTML__
    </div>
</nav>

<div class="main">
    <div class="top-bar">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
        <button class="back-btn" id="backBtn" onclick="showAll()">显示全部</button>
        <span class="db-name">__DATABASE__</span>
    </div>

    <div class="content">
        __STATS_HTML__

        <div class="legend">
            <span style="font-weight:600;">注释来源:</span>
            <span class="legend-item"><span class="source-tag source-db">数据库</span></span>
            <span class="legend-item"><span class="source-tag source-code">代码注释</span></span>
            <span class="legend-item"><span class="source-tag source-jsp">JSP标签</span></span>
            <span class="legend-item"><span class="source-tag source-enum">枚举类</span></span>
            <span class="legend-item"><span class="source-tag source-ai">AI推测</span></span>
            <span class="legend-item"><span class="source-tag source-pending">待补充</span></span>
        </div>

        <div id="tablesContainer">
            __TABLES_HTML__
            __ENTITY_HTML__
        </div>

        <div id="noResults" class="hidden" style="text-align:center;padding:60px;color:var(--text-light);">
            <p style="font-size:48px;">&#128269;</p>
            <p style="font-size:16px;margin-top:12px;">没有找到匹配的表或字段</p>
        </div>
    </div>
</div>

<script>
(function() {
    var searchInput = document.getElementById('searchInput');
    var tablesContainer = document.getElementById('tablesContainer');
    var noResults = document.getElementById('noResults');
    var backBtn = document.getElementById('backBtn');
    var navItems = document.querySelectorAll('.nav-item');
    var sections = document.querySelectorAll('.table-section');

    // Current filter state
    var currentFilter = null; // null = show all, { table, section } = show one

    function showAll() {
        currentFilter = null;
        sections.forEach(function(s) { s.classList.remove('hidden'); });
        navItems.forEach(function(n) { n.classList.remove('hidden'); n.classList.remove('active'); });
        backBtn.classList.remove('visible');
        searchInput.value = '';
    }

    function showOnly(tableName, sectionType) {
        currentFilter = { table: tableName, section: sectionType };
        sections.forEach(function(s) { s.classList.add('hidden'); });
        var prefix = sectionType === 'entity' ? 'entity-' : 'table-';
        var target = document.getElementById(prefix + tableName);
        if (target) {
            target.classList.remove('hidden');
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        backBtn.classList.add('visible');
    }

    function showSection(sectionType) {
        currentFilter = { section: sectionType };
        sections.forEach(function(s) {
            var src = s.dataset.source || 'db';
            s.classList.toggle('hidden', src !== sectionType);
        });
        navItems.forEach(function(n) { n.classList.remove('active'); });
        backBtn.classList.add('visible');
    }

    // Expose to global scope for onclick handlers
    window.showAll = showAll;
    window.showAllSection = showSection;
    window.toggleSection = function(el) {
        el.parentElement.classList.toggle('collapsed');
    };

    // Nav item clicks
    navItems.forEach(function(item) {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            var tableName = this.dataset.table;
            var sectionType = this.dataset.section;
            showOnly(tableName, sectionType);
            navItems.forEach(function(n) { n.classList.remove('active'); });
            item.classList.add('active');
            document.getElementById('sidebar').classList.remove('open');
        });
    });

    // Search button enable/disable on input
    var searchBtn = document.getElementById('searchBtn');

    // Enter key triggers search
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
    });

    function doSearch() {
        var q = searchInput.value.toLowerCase().trim();
        if (!q) {
            // Empty input = show all
            showAll();
            return;
        }

        // Search across all sections by content
        var visible = 0;
        var matchedSections = [];
        sections.forEach(function(s) {
            var name = s.dataset.tableName.toLowerCase();
            var text = s.textContent.toLowerCase();
            var match = name.includes(q) || text.includes(q);
            s.classList.toggle('hidden', !match);
            if (match) {
                visible++;
                matchedSections.push(s.dataset.tableName);
            }
        });

        // Show sidebar items that correspond to matched sections
        var matchedSet = {};
        matchedSections.forEach(function(n) { matchedSet[n] = true; });
        navItems.forEach(function(item) {
            var tableName = item.dataset.table;
            item.classList.toggle('hidden', !matchedSet[tableName]);
        });

        noResults.classList.toggle('hidden', visible > 0);
        backBtn.classList.add('visible');
    }

    // Search button click
    searchBtn.addEventListener('click', doSearch);

    // Back button
    backBtn.addEventListener('click', showAll);

    // --- Inline Editing ---
    var API_BASE = '__API_BASE__';
    var toastEl = document.createElement('div');
    toastEl.className = 'edit-toast';
    document.body.appendChild(toastEl);

    function showToast(msg, ok) {
        toastEl.textContent = msg;
        toastEl.className = 'edit-toast show ' + (ok ? 'ok' : 'fail');
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(function() { toastEl.className = 'edit-toast'; }, 2000);
    }

    function saveComment(table, field, comment, td, origText) {
        td.classList.add('edit-saving');
        fetch(API_BASE + '/api/save-comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ table: table, field: field, comment: comment })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            td.classList.remove('edit-saving');
            if (data.ok) {
                td.classList.add('edit-success');
                setTimeout(function() { td.classList.remove('edit-success'); }, 800);
                showToast('保存成功', true);
            } else {
                td.classList.add('edit-error');
                setTimeout(function() { td.classList.remove('edit-error'); }, 800);
                td.textContent = origText;
                showToast('保存失败: ' + data.message, false);
            }
        })
        .catch(function(err) {
            td.classList.remove('edit-saving');
            td.classList.add('edit-error');
            setTimeout(function() { td.classList.remove('edit-error'); }, 800);
            td.textContent = origText;
            showToast('网络错误', false);
        });
    }

    function startEdit(td, tableName, fieldName) {
        if (td.querySelector('.edit-input')) return;
        var origText = td.textContent.trim();
        td.textContent = '';
        td.classList.remove('editable');

        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'edit-input';
        input.value = origText.replace('[待补充] ', '');
        td.appendChild(input);

        var bar = document.createElement('div');
        bar.className = 'edit-bar';
        var btnOk = document.createElement('button');
        btnOk.textContent = '保存';
        var btnCancel = document.createElement('button');
        btnCancel.textContent = '取消';
        var hint = document.createElement('span');
        hint.className = 'edit-hint';
        hint.textContent = 'Enter 保存 / Esc 取消';
        bar.appendChild(btnOk);
        bar.appendChild(btnCancel);
        bar.appendChild(hint);
        td.appendChild(bar);

        input.focus();
        input.select();

        function doSave() {
            var newVal = input.value.trim();
            if (newVal === origText.replace('[待补充] ', '') || newVal === origText) {
                td.textContent = origText;
                td.classList.add('editable');
                return;
            }
            saveComment(tableName, fieldName, newVal, td, origText);
            td.textContent = newVal || origText;
            td.classList.add('editable');
        }

        function doCancel() {
            td.textContent = origText;
            td.classList.add('editable');
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doSave(); }
            if (e.key === 'Esc' || e.key === 'Escape') { e.preventDefault(); doCancel(); }
        });

        btnOk.addEventListener('click', doSave);
        btnCancel.addEventListener('click', doCancel);
    }

    // Field comment editing
    document.addEventListener('click', function(e) {
        var td = e.target.closest('.col-comment.editable');
        if (!td) return;
        var section = td.closest('.table-section');
        if (!section) return;
        var tableName = section.dataset.tableName;
        var row = td.closest('tr');
        var fieldName = row ? row.querySelector('.col-name code') : null;
        if (!tableName || !fieldName) return;
        startEdit(td, tableName, fieldName.textContent.trim());
    });

    // Table comment editing
    document.addEventListener('click', function(e) {
        var desc = e.target.closest('.table-desc.editable');
        if (!desc) return;
        var section = desc.closest('.table-section');
        if (!section) return;
        var tableName = section.dataset.tableName;
        if (!tableName) return;

        if (desc.querySelector('.edit-input')) return;
        var origText = desc.textContent.trim();
        desc.textContent = '';
        desc.classList.remove('editable');

        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'edit-input';
        input.value = origText === '无注释' ? '' : origText;
        input.placeholder = '输入表注释...';
        desc.appendChild(input);

        var bar = document.createElement('div');
        bar.className = 'edit-bar';
        var btnOk = document.createElement('button');
        btnOk.textContent = '保存';
        var btnCancel = document.createElement('button');
        btnCancel.textContent = '取消';
        bar.appendChild(btnOk);
        bar.appendChild(btnCancel);
        desc.appendChild(bar);

        input.focus();
        input.select();

        function doSave() {
            var newVal = input.value.trim();
            if (newVal === origText || (newVal === '' && origText === '无注释')) {
                desc.textContent = origText;
                desc.classList.add('editable');
                return;
            }
            desc.classList.add('edit-saving');
            fetch(API_BASE + '/api/save-comment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table: tableName, field: '', comment: newVal })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                desc.classList.remove('edit-saving');
                if (data.ok) {
                    desc.classList.add('edit-success');
                    setTimeout(function() { desc.classList.remove('edit-success'); }, 800);
                    desc.textContent = newVal || '无注释';
                    showToast('表注释保存成功', true);
                } else {
                    desc.classList.add('edit-error');
                    setTimeout(function() { desc.classList.remove('edit-error'); }, 800);
                    desc.textContent = origText;
                    showToast('保存失败: ' + data.message, false);
                }
                desc.classList.add('editable');
            })
            .catch(function() {
                desc.classList.remove('edit-saving');
                desc.textContent = origText;
                desc.classList.add('editable');
                showToast('网络错误', false);
            });
        }

        function doCancel() {
            desc.textContent = origText;
            desc.classList.add('editable');
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doSave(); }
            if (e.key === 'Esc' || e.key === 'Escape') { e.preventDefault(); doCancel(); }
        });
        btnOk.addEventListener('click', doSave);
        btnCancel.addEventListener('click', doCancel);
    });
})();
</script>
</body>
</html>
